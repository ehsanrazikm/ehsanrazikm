<!doctype html>
<title>Agent Clan HQ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
  /* This page is a game world, so it keeps one look in light and dark mode. */
  :root {
    color-scheme: light;
    --grass: #7CC243;
    --grass-dark: #5FA532;
    --dirt: #C9A46A;
    --wood: #6B4226;
    --wood-light: #8A5A34;
    --parchment: #F6E7C1;
    --ink: #2B1A0E;
    --gold: #FFD23F;
    --elixir: #D63AF9;
    --gem: #3FE07A;
    --good: #3FBF3F;
    --bad: #E53935;
    --title: "Lilita One", "Arial Black", Impact, sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: #3D6B22; color: #fff;
    font: 600 14px/1.4 var(--body);
    padding: 12px 16px 24px;
  }
  .game { max-width: 1100px; margin: 0 auto; display: grid; gap: 10px; }
  .stroke { font-family: var(--title); letter-spacing: .02em; color: #fff;
            text-shadow: 0 2px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000; }

  /* ---------- Top bar (clan badge + resources) ---------- */
  .hud { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .clan { display: flex; align-items: center; gap: 10px; }
  .badge {
    width: 48px; height: 54px; flex: none;
    background: linear-gradient(#FF8A1A, #D9480F); border: 3px solid var(--gold);
    clip-path: polygon(50% 0, 100% 18%, 100% 70%, 50% 100%, 0 70%, 0 18%);
    display: grid; place-items: center; font: 26px var(--title);
  }
  .clan h1 { margin: 0; font-size: clamp(22px, 4vw, 30px); font-weight: 400; line-height: 1; }
  .clan p { margin: 2px 0 0; font-size: 12px; opacity: .85; }
  .res { display: flex; flex-wrap: wrap; gap: 8px; }
  .res div {
    display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.45);
    border-radius: 999px; padding: 4px 14px 4px 4px; min-width: 120px;
  }
  .res i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(0,0,0,.4); flex: none; }
  .res .g i { background: radial-gradient(circle at 35% 35%, #FFF3A0, var(--gold) 55%, #C99400); }
  .res .e i { background: radial-gradient(circle at 35% 35%, #F7B6FF, var(--elixir) 55%, #8A1BA8); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
  .res .m i { background: radial-gradient(circle at 35% 35%, #C9FFD9, var(--gem) 55%, #178A43); border-radius: 6px; transform: rotate(45deg) scale(.8); }
  .res b { font: 18px var(--title); font-variant-numeric: tabular-nums; }
  .res span { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; opacity: .8; display: block; line-height: 1; }

  /* ---------- The village map ---------- */
  .map {
    position: relative; width: 100%; aspect-ratio: 16 / 10; max-width: 100%;
    border-radius: 18px; overflow: hidden; border: 4px solid var(--wood);
    background:
      radial-gradient(ellipse 30% 22% at 50% 54%, var(--dirt) 0 60%, transparent 62%),
      repeating-linear-gradient(45deg, transparent 0 22px, rgba(0,0,0,.035) 22px 44px),
      repeating-linear-gradient(-45deg, transparent 0 22px, rgba(255,255,255,.04) 22px 44px),
      radial-gradient(circle at 50% 45%, var(--grass), var(--grass-dark));
  }
  @media (max-width: 640px) { .map { aspect-ratio: 3 / 4; } }
  .deco { position: absolute; transform: translate(-50%, -100%); pointer-events: none; }

  .bldg {
    position: absolute; transform: translate(-50%, -78%);
    width: clamp(78px, 13vw, 128px); background: none; border: 0; padding: 0;
    cursor: pointer; color: #fff; font: inherit;
  }
  .bldg:focus-visible { outline: 3px dashed var(--gold); outline-offset: 4px; border-radius: 12px; }
  .bldg svg { display: block; width: 100%; height: auto; overflow: visible; transition: transform .15s; }
  .bldg:hover svg { transform: scale(1.06); }
  .tag {
    position: absolute; left: 50%; top: -6px; transform: translate(-50%, -100%);
    display: grid; gap: 3px; justify-items: center; white-space: nowrap; pointer-events: none;
  }
  .tag .nm { font: 15px var(--title); }
  .tag .lv { font-size: 11px; font-family: var(--body); font-weight: 800; background: rgba(0,0,0,.5); border-radius: 6px; padding: 0 5px; }
  .pbar { width: 70px; height: 10px; background: rgba(0,0,0,.55); border: 2px solid #000; border-radius: 6px; overflow: hidden; }
  .pbar i { display: block; height: 100%; width: 0; background: linear-gradient(#9CF36A, #3FA42B); transition: width .5s linear; }
  .bldg:not(.working):not(.stuck) .pbar { visibility: hidden; }
  .stuck .pbar i { background: linear-gradient(#FF8A80, var(--bad)); }

  /* status bubble floating over the building */
  .bubble {
    position: absolute; right: -4px; top: 18%; font: 16px var(--title);
    background: #fff; color: var(--ink); border: 2px solid #000; border-radius: 12px; padding: 0 7px;
    animation: bob 1.6s ease-in-out infinite;
  }
  .bubble.zz { background: #DDE6F5; }
  .bubble.think { background: #EADBFF; }
  .bubble.bang { background: var(--bad); color: #fff; }
  .bubble.win { background: var(--gold); }
  .bubble.mail { background: var(--bad); color: #fff; }
  .real .tag .lv { background: var(--bad); }
  .real .pbar { display: none; }

  /* Mail Scout report */
  .report { display: grid; gap: 12px; max-height: 60vh; overflow-y: auto; }
  .report h4 { margin: 0 0 6px; font: 17px var(--title); font-weight: 400; display: flex; align-items: center; gap: 8px; }
  .report h4 .chip { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #000; }
  .report ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .report li { background: #EAD39C; border-radius: 10px; padding: 8px 10px; }
  .report li b { display: block; }
  .report li p { margin: 2px 0 0; font-size: 13px; font-weight: 600; }
  .report li a { font-size: 12px; font-weight: 800; color: #1F5FA8; }
  .tone-bad .chip { background: var(--bad); } .tone-warn .chip { background: #FF9800; }
  .tone-info .chip { background: #9E9E8E; } .tone-ok .chip { background: var(--good); }
  .report .when { font-size: 12px; color: #7A5A3A; margin: 0; }
  @keyframes bob { 50% { transform: translateY(-5px); } }

  /* building animations */
  .smoke circle { fill: #EEE; opacity: 0; }
  .working .smoke circle { animation: puff 2.4s ease-out infinite; }
  .working .smoke circle:nth-child(2) { animation-delay: .8s; }
  .working .smoke circle:nth-child(3) { animation-delay: 1.6s; }
  @keyframes puff { 0% { opacity: .9; transform: translate(0, 0) scale(.6); } 100% { opacity: 0; transform: translate(6px, -26px) scale(1.6); } }
  .win-light { fill: #3A2A1A; }
  .working .win-light, .thinking .win-light { fill: #FFE066; }
  .stuck .walls { animation: shake .35s ease-in-out infinite; }
  .flag { transform-origin: 0 50%; animation: wave 1.2s ease-in-out infinite alternate; }
  @keyframes wave { to { transform: skewY(8deg) scaleX(.85); } }
  @keyframes shake { 25% { transform: translateX(-1.5px); } 75% { transform: translateX(1.5px); } }

  /* ---------- Bottom row: buttons + clan chat ---------- */
  .bottom { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  @media (max-width: 760px) { .bottom { grid-template-columns: minmax(0, 1fr); } }
  .wood {
    background: var(--wood); border: 3px solid #3E2514; border-radius: 14px; padding: 10px 12px;
    box-shadow: inset 0 2px 0 var(--wood-light);
  }
  .wood h2 { margin: 0 0 6px; font-size: 20px; font-weight: 400; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    font: 16px var(--title); color: #fff; border: 2px solid #000; border-radius: 10px; padding: 6px 14px;
    background: linear-gradient(#8BE04E, #4E9F24); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); cursor: pointer;
    text-shadow: 0 1px 0 #000;
  }
  .btn.blue { background: linear-gradient(#5FC3FF, #1F7BD1); }
  .btn.orange { background: linear-gradient(#FFB84D, #E57A00); }
  .btn:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  form.add { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  form.add input, form.add select {
    font: 700 14px var(--body); border: 2px solid #000; border-radius: 8px; padding: 6px 8px;
    background: var(--parchment); color: var(--ink); width: 130px;
  }
  .chat { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 190px; overflow-y: auto; font-size: 13px; }
  .chat li { background: rgba(0,0,0,.25); border-radius: 8px; padding: 4px 8px; }
  .chat li b { color: var(--gold); }
  .chat li.fail b { color: #FF8A80; }
  .chat time { float: right; font-size: 11px; opacity: .6; font-variant-numeric: tabular-nums; }

  /* ---------- Info popup (opens when you tap a building) ---------- */
  .popup {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 1000;
  }
  .sheet {
    width: min(440px, 100%); background: var(--parchment); color: var(--ink);
    border: 4px solid var(--wood); border-radius: 16px; overflow: hidden;
  }
  .sheet header { background: var(--wood); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .sheet header h3 { margin: 0; font-size: 22px; font-weight: 400; }
  .x { background: var(--bad); border: 2px solid #000; color: #fff; font: 18px var(--title); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; }
  .sheet .body { padding: 14px; display: grid; gap: 12px; }
  .sheet .row { display: flex; gap: 12px; align-items: center; }
  .sheet .pic { width: 110px; flex: none; }
  .sheet .now { font-size: 14px; }
  .sheet .now small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #7A5A3A; }
  .statgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .stat { background: #EAD39C; border-radius: 10px; padding: 6px 10px; display: flex; justify-content: space-between; gap: 8px; font-weight: 800; }
  .stat b { font-variant-numeric: tabular-nums; }
  .xpbar { height: 14px; background: #C9B07A; border: 2px solid #000; border-radius: 8px; overflow: hidden; }
  .xpbar i { display: block; height: 100%; background: linear-gradient(#F7B6FF, var(--elixir)); }
  .dots { display: flex; gap: 4px; align-items: center; font-size: 12px; font-weight: 800; }
  .dots span { width: 14px; height: 14px; border-radius: 4px; background: #C9B07A; border: 1px solid rgba(0,0,0,.3); }
  .dots .ok { background: var(--good); } .dots .fail { background: var(--bad); }
  .ranks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .ranks li { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; background: #EAD39C; border-radius: 10px; padding: 6px 10px; font-weight: 800; }
  .ranks .r { font: 18px var(--title); color: #7A5A3A; }
  .ranks li:first-child { background: var(--gold); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<div class="game">
  <div class="hud">
    <div class="clan">
      <div class="badge stroke">A</div>
      <div>
        <h1 class="stroke" id="clanName">Robot Clan Village</h1>
        <p>The Mail Scout is real. The other agents are pretend examples. Tap a building!</p>
      </div>
    </div>
    <div class="res">
      <div class="g"><i></i><p style="margin:0"><b id="rGold">0</b><span>Tasks done</span></p></div>
      <div class="e"><i></i><p style="margin:0"><b id="rElixir">0</b><span>Total XP</span></p></div>
      <div class="m"><i></i><p style="margin:0"><b id="rGem">0%</b><span>Success</span></p></div>
    </div>
  </div>

  <div class="map" id="map" aria-label="Village map"></div>

  <div class="bottom">
    <div class="wood">
      <h2 class="stroke">Village chief controls</h2>
      <div class="btns">
        <button class="btn" id="pauseBtn" type="button">Pause</button>
        <button class="btn orange" id="rankBtn" type="button">Leaderboard</button>
      </div>
      <form class="add" id="addForm">
        <input id="newName" placeholder="Agent name" maxlength="12" required>
        <input id="newRole" placeholder="Job, like Artist" maxlength="18" required>
        <select id="newShape" aria-label="Building type">
          <option value="house">House</option>
          <option value="tower">Tower</option>
          <option value="hut">Hut</option>
        </select>
        <button class="btn blue" type="submit">Build</button>
      </form>
    </div>
    <div class="wood">
      <h2 class="stroke">Clan chat</h2>
      <ul class="chat" id="chat"></ul>
    </div>
  </div>
</div>

<div class="popup" id="popup" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="popTitle">
    <header><h3 class="stroke" id="popTitle"></h3><button class="x" id="popClose" type="button" aria-label="Close">X</button></header>
    <div class="body" id="popBody"></div>
  </div>
</div>

<script>
/* =========================================================
   STEP 1: YOUR CLAN MEMBERS (each one is a building)
   name  = the agent's name
   role  = its job
   shape = "house", "tower" or "hut"
   color = roof color
   skill = how good it is (0 to 1). 0.9 means 9 out of 10 jobs go right.
   ========================================================= */
const CLAN = [
  { name: "Scout",  role: "Researcher",   shape: "tower", color: "#2E86DE", skill: 0.92 },
  { name: "Quill",  role: "Writer",       shape: "house", color: "#8E44AD", skill: 0.88 },
  { name: "Bolt",   role: "Coder",        shape: "hut",   color: "#16A085", skill: 0.80 },
  { name: "Pixel",  role: "Designer",     shape: "house", color: "#E84393", skill: 0.85 },
  { name: "Ledger", role: "Math checker", shape: "tower", color: "#D35400", skill: 0.95 },
  { name: "Echo",   role: "Email helper", shape: "hut",   color: "#546E7A", skill: 0.90 },
];

/* STEP 3: THE MAIL SCOUT (a real agent, not pretend)
   Claude reads your email and writes the report below. Ask Claude:
   "Mail Scout, check my mail" and it updates this part. */
const MAIL_SCOUT = { name: "Mail Scout", role: "Reads your email", shape: "post", color: "#C62828" };
/*MAIL_REPORT_START*/
const MAIL_REPORT = {
  checked: "This public website shows an example report. Your real mail report is private, so only you can see it.",
  privateLink: "https://claude.ai/artifact/YLBsfvCamSjRZZtxj7vX49",
  sections: [
    { title: "Do today", tone: "bad", items: [
      { what: "Team meeting at 3:30 PM", why: "Someone asked you to bring numbers to the meeting.", link: "" } ] },
    { title: "Waiting for your reply", tone: "warn", items: [
      { what: "A question from a colleague", why: "Nobody has answered yet.", link: "" } ] },
    { title: "Emails that mention your name", tone: "info", items: [
      { what: "A message that says your name", why: "What it asks you to do.", link: "" } ] },
    { title: "Done", tone: "ok", items: [
      { what: "A reply you already sent", why: "Nothing left to do.", link: "" } ] },
  ],
};
/*MAIL_REPORT_END*/

/* STEP 2: THE KINDS OF JOBS EACH AGENT DOES (used for the pretend work) */
const JOBS = {
  "Researcher":   ["Searching the web for dinosaur facts", "Reading 5 articles about space", "Finding the best pizza recipe"],
  "Writer":       ["Writing a short story", "Fixing spelling in homework", "Making a birthday poem"],
  "Coder":        ["Building a calculator app", "Fixing a bug in the game", "Making a button turn blue"],
  "Designer":     ["Drawing a logo", "Picking colors for the website", "Making a poster"],
  "Math checker": ["Checking 20 math answers", "Adding up pocket money", "Counting stars in a photo"],
  "Email helper": ["Sorting the inbox", "Writing a thank-you email", "Finding the email from Grandma"],
};
const ANY_JOB = ["Helping a friend", "Tidying up files", "Learning something new"];

/* ---------- Everything below makes the village work ---------- */
const agents = [];
let paused = false, clanDone = 0, clanOk = 0, clock = 0; // clock counts seconds
let openAgent = null, showRanks = false;
const map = document.getElementById("map");

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function shade(hex, amt) { // make a color lighter (+) or darker (-)
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, v + amt));
  return "#" + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, "0")).join("");
}
function level(a) { return Math.floor(a.xp / 100) + 1; }
function rate(a) { return a.done ? a.ok / a.done : 0; }
function score(a) { return Math.round(a.done * rate(a) * 10); }

/* Draws one building as a picture (SVG). Bigger level = more gold stars. */
function buildingSVG(shape, color, lvl, isTownHall) {
  const roof = color, roofDark = shade(color, -45);
  const wallH = shape === "tower" ? 46 : shape === "hut" ? 18 : 30;
  const top = 73 - wallH, topL = 55 - wallH;
  const walls = `
    <g class="walls">
      <polygon points="25,85 60,103 60,${top + 30} 25,${topL + 30}" fill="#C8B79A"/>
      <polygon points="60,103 95,85 95,${topL + 30} 60,${top + 30}" fill="#E6D6B8"/>
      <rect x="36" y="${Math.max(topL + 38, 80)}" width="11" height="15" rx="5" fill="#5A3A1E" transform="skewY(27)" transform-origin="41 90"/>
      <rect class="win-light" x="70" y="${topL + 40}" width="9" height="9" rx="2" transform="skewY(-27)" transform-origin="74 ${topL + 44}"/>
      ${shape === "tower" ? `<rect class="win-light" x="70" y="${topL + 58}" width="9" height="9" rx="2" transform="skewY(-27)" transform-origin="74 ${topL + 62}"/>` : ""}
    </g>`;
  const ry = topL + 30, ty = top + 30;         // top edge of walls
  let roofSVG;
  if (shape === "hut") {                         // round dome
    roofSVG = `<path d="M25,${ry} Q25,${ry - 34} 60,${ry - 36} Q95,${ry - 34} 95,${ry} L60,${ty} Z" fill="${roof}"/>
               <path d="M60,${ty} L95,${ry} Q95,${ry - 34} 60,${ry - 36} Z" fill="${roofDark}" opacity=".45"/>`;
  } else {                                       // pointy roof (taller on towers)
    const peak = ry - (shape === "tower" ? 40 : 30);
    roofSVG = `<polygon points="20,${ry + 2} 60,${ty + 3} 60,${peak}" fill="${roof}"/>
               <polygon points="60,${ty + 3} 100,${ry + 2} 60,${peak}" fill="${roofDark}"/>
               <line x1="60" y1="${peak}" x2="60" y2="${peak - 14}" stroke="#3E2514" stroke-width="2"/>
               <polygon class="flag" points="60,${peak - 14} 74,${peak - 10} 60,${peak - 6}" fill="${isTownHall ? "#FFD23F" : shade(color, 60)}"/>`;
  }
  const chimX = shape === "hut" ? 76 : 80, chimY = ry - 12;
  const chimney = `
    <rect x="${chimX}" y="${chimY - 8}" width="7" height="14" fill="#8A7B6A"/>
    <g class="smoke"><circle cx="${chimX + 3}" cy="${chimY - 10}" r="4"/><circle cx="${chimX + 3}" cy="${chimY - 10}" r="4"/><circle cx="${chimX + 3}" cy="${chimY - 10}" r="4"/></g>`;
  const stars = Array.from({ length: Math.min(lvl, 5) }, (_, i) =>
    `<polygon points="0,-5 1.5,-1.5 5,-1.5 2.2,0.8 3.2,4.5 0,2.3 -3.2,4.5 -2.2,0.8 -5,-1.5 -1.5,-1.5"
      transform="translate(${60 - (Math.min(lvl, 5) - 1) * 6 + i * 12},114)" fill="#FFD23F" stroke="#7A5A00" stroke-width=".8"/>`).join("");
  const post = shape !== "post" ? "" : `
    <g transform="translate(66 ${topL + 44}) skewY(-27)"><rect width="22" height="15" rx="2" fill="#fff" stroke="#333" stroke-width="1.2"/>
      <polyline points="0,0 11,8 22,0" fill="none" stroke="#333" stroke-width="1.2"/></g>
    <rect x="100" y="80" width="3" height="18" fill="#5A3A1E"/>
    <rect x="94" y="70" width="15" height="11" rx="5" fill="#E53935" stroke="#7A1010" stroke-width="1"/>
    <rect x="106" y="64" width="2" height="8" fill="#333"/><rect x="106" y="64" width="6" height="4" fill="#FFD23F"/>`;
  return `<svg viewBox="0 0 120 120" aria-hidden="true">
    <ellipse cx="60" cy="97" rx="54" ry="24" fill="rgba(0,0,0,.18)"/>
    <polygon points="60,72 108,95 60,118 12,95" fill="#9E9E8E"/>
    <polygon points="60,76 100,95 60,114 20,95" fill="#B8B8A6"/>
    ${walls}${chimney}${roofSVG}${post}${stars}
  </svg>`;
}

/* Little trees and rocks to make the village pretty */
function decorate() {
  const tree = `<svg width="34" height="44" viewBox="0 0 34 44"><rect x="14" y="30" width="6" height="12" fill="#6B4226"/><circle cx="17" cy="20" r="14" fill="#2F7D1F"/><circle cx="12" cy="15" r="6" fill="#3F9A2A"/></svg>`;
  const rock = `<svg width="28" height="18" viewBox="0 0 28 18"><ellipse cx="14" cy="11" rx="13" ry="7" fill="#8C8C80"/><ellipse cx="11" cy="8" rx="6" ry="3" fill="#B0B0A2"/></svg>`;
  const spots = [[4, 18, tree], [95, 14, tree], [8, 94, tree], [93, 92, tree], [30, 6, rock], [70, 97, rock], [3, 55, tree], [97, 55, rock]];
  for (const [x, y, svg] of spots) {
    const d = document.createElement("div");
    d.className = "deco"; d.style.left = x + "%"; d.style.top = y + "%"; d.innerHTML = svg;
    map.appendChild(d);
  }
}

/* The Town Hall in the middle shows the whole clan */
const townHall = { name: "Town Hall", el: null };
function placeTownHall() {
  const b = document.createElement("button");
  b.type = "button"; b.className = "bldg working"; b.style.left = "50%"; b.style.top = "58%";
  b.style.width = "clamp(100px, 17vw, 170px)"; b.style.zIndex = 54;
  b.setAttribute("aria-label", "Town Hall: whole clan leaderboard");
  b.innerHTML = `<div class="tag"><span class="nm stroke">Town Hall</span></div>${buildingSVG("tower", "#B03A2E", 5, true)}`;
  b.onclick = () => { showRanks = true; openAgent = null; renderPopup(); };
  map.appendChild(b);
  townHall.el = b;
}

/* Place each agent's building in a ring around the Town Hall */
function layout() {
  const n = agents.length, narrow = map.clientWidth < 560;
  agents.forEach((a, i) => {
    const ang = (i / n) * Math.PI * 2 - Math.PI / 2;
    const x = 50 + Math.cos(ang) * (narrow ? 34 : 36);
    const y = 60 + Math.sin(ang) * (narrow ? 30 : 31);
    a.el.style.left = x + "%"; a.el.style.top = y + "%"; a.el.style.zIndex = Math.round(y);
  });
}

function makeAgent(cfg) {
  const a = { ...cfg, status: "idle", task: "Waiting for a job", progress: 0, done: 0, ok: 0,
              totalTime: 0, started: 0, speed: 0, history: [], xp: 0, rest: rand(1, 3), lastWin: 0, drawnLvl: 0 };
  const b = document.createElement("button");
  b.type = "button"; b.className = "bldg";
  b.innerHTML = `<div class="tag"><span class="nm stroke"></span><span class="lv"></span><span class="pbar"><i></i></span></div>
                 <div class="pic"></div><span class="bubble" hidden></span>`;
  b.onclick = () => { openAgent = a; showRanks = false; renderPopup(); };
  a.el = b;
  map.appendChild(b);
  agents.push(a);
  return a;
}

/* One "tick" happens every second. Each agent moves one step forward. */
function tick() {
  if (paused) return;
  const now = ++clock;
  for (const a of agents) {
    if (a.real) continue;              // the Mail Scout does real work, not pretend work
    if (a.status === "idle") {
      if (--a.rest <= 0) {
        a.status = "thinking"; a.task = pick(JOBS[a.role] || ANY_JOB); a.progress = 0;
        a.started = now; a.rest = rand(1, 2);
      }
    } else if (a.status === "thinking") {
      if (--a.rest <= 0) { a.status = "working"; a.speed = rand(6, 18) * (0.6 + a.skill * 0.6); }
    } else if (a.status === "working") {
      if (Math.random() < 0.02) { a.status = "stuck"; a.rest = rand(2, 4); chat(a.name, `got stuck on "${a.task}"`, "fail"); continue; }
      a.progress = Math.min(100, a.progress + a.speed);
      if (a.progress >= 100) finish(a, now);
    } else if (a.status === "stuck") {
      if (--a.rest <= 0) { a.status = "working"; chat(a.name, "is working again"); }
    }
  }
  render();
}

function finish(a, now) {
  const success = Math.random() < a.skill;
  const before = level(a);
  a.done++; clanDone++;
  if (success) { a.ok++; clanOk++; a.xp += 20; a.lastWin = now; }
  a.totalTime += now - a.started;
  a.history = [...a.history, success].slice(-10);
  chat(a.name, `${success ? "finished" : "failed"}: ${a.task}`, success ? "" : "fail");
  if (level(a) > before) chat(a.name, `upgraded to level ${level(a)}!`);
  a.status = "idle"; a.task = success ? "Resting after a win" : "Resting, will try again"; a.progress = 0; a.rest = rand(1, 3);
}

const STATUS = { idle: "Resting", thinking: "Thinking", working: "Working", stuck: "Stuck" };

function render() {
  for (const a of agents) {
    if (a.real) { renderMailScout(a); continue; }
    const lvl = level(a);
    a.el.className = "bldg " + a.status;
    a.el.setAttribute("aria-label", `${a.name}, level ${lvl}, ${STATUS[a.status]}`);
    a.el.querySelector(".nm").textContent = a.name;
    a.el.querySelector(".lv").textContent = `Lv ${lvl} · ${STATUS[a.status]}`;
    a.el.querySelector(".pbar i").style.width = a.progress + "%";
    if (a.drawnLvl !== lvl) { a.el.querySelector(".pic").innerHTML = buildingSVG(a.shape, a.color, lvl); a.drawnLvl = lvl; }
    const bub = a.el.querySelector(".bubble");
    const justWon = a.status === "idle" && clock - a.lastWin <= 1;
    const kind = justWon ? ["win", "+20"] : a.status === "idle" ? ["zz", "Zzz"] : a.status === "thinking" ? ["think", "?"] : a.status === "stuck" ? ["bang", "!"] : null;
    bub.hidden = !kind;
    if (kind) { bub.className = "bubble " + kind[0]; bub.textContent = kind[1]; }
  }
  document.getElementById("rGold").textContent = clanDone;
  document.getElementById("rElixir").textContent = agents.reduce((s, a) => s + a.xp, 0);
  document.getElementById("rGem").textContent = (clanDone ? Math.round(clanOk / clanDone * 100) : 0) + "%";
  if (!document.getElementById("popup").hidden) renderPopup();
}

/* The Mail Scout shows how many things need you */
function mailTodo() {
  return MAIL_REPORT.sections.filter(s => s.tone === "bad" || s.tone === "warn").reduce((n, s) => n + s.items.length, 0);
}
function renderMailScout(a) {
  if (a.drawn) return;
  const n = mailTodo();
  a.el.className = "bldg working real";
  a.el.setAttribute("aria-label", `Mail Scout: ${n} things need you. Tap to read the report.`);
  a.el.querySelector(".nm").textContent = a.name;
  a.el.querySelector(".lv").textContent = "Real agent · Report ready";
  a.el.querySelector(".pic").innerHTML = buildingSVG(a.shape, a.color, 3);
  const bub = a.el.querySelector(".bubble");
  bub.hidden = n === 0; bub.className = "bubble mail"; bub.textContent = n + " to do";
  a.drawn = true;
}
function mailReportHTML() {
  const priv = MAIL_REPORT.privateLink
    ? `<a class="btn blue" href="${esc(MAIL_REPORT.privateLink)}" target="_blank" rel="noopener" style="justify-self:start;text-decoration:none">Open my real report</a>` : "";
  return `<div class="report"><p class="when">${esc(MAIL_REPORT.checked)}</p>${priv}` +
    MAIL_REPORT.sections.filter(s => s.items.length).map(s => `
      <section class="tone-${s.tone}"><h4 class="stroke"><span class="chip"></span>${esc(s.title)} (${s.items.length})</h4>
      <ul>${s.items.map(i => `<li><b>${esc(i.what)}</b><p>${esc(i.why)}</p>${
        i.link ? `<a href="${esc(i.link)}" target="_blank" rel="noopener">Open in Gmail</a>` : ""}</li>`).join("")}</ul></section>`).join("") +
    `</div>`;
}

/* The info window that opens when you tap a building */
function renderPopup() {
  const pop = document.getElementById("popup");
  const title = document.getElementById("popTitle"), body = document.getElementById("popBody");
  if (showRanks) {
    title.textContent = "Clan leaderboard";
    const ranked = agents.filter(a => !a.real).sort((x, y) => score(y) - score(x));
    body.innerHTML = `<p style="margin:0">Score = tasks done × success rate. Tap a building to see its details.</p>
      <ol class="ranks">${ranked.map((a, i) => `<li><span class="r">${i + 1}</span><span>${esc(a.name)} <small>(Lv ${level(a)})</small></span><span>${score(a)}</span></li>`).join("")}</ol>`;
  } else if (openAgent && openAgent.real) {
    title.textContent = "Mail Scout report";
    if (!pop.hidden && pop.dataset.showing === "mail") return;   // don't reset scrolling every second
    body.innerHTML = mailReportHTML();
    pop.dataset.showing = "mail"; pop.hidden = false; return;
  } else if (openAgent) {
    const a = openAgent, lvl = level(a);
    title.textContent = `${a.name} (Level ${lvl})`;
    const dots = Array.from({ length: 10 }, (_, i) => { const r = a.history[i]; return `<span class="${r === undefined ? "" : r ? "ok" : "fail"}"></span>`; }).join("");
    body.innerHTML = `
      <div class="row"><div class="pic">${buildingSVG(a.shape, a.color, lvl)}</div>
        <div class="now"><small>${esc(a.role)} · ${STATUS[a.status]}</small>${esc(a.task)}</div></div>
      <div class="statgrid">
        <div class="stat">Tasks done <b>${a.done}</b></div>
        <div class="stat">Success <b>${Math.round(rate(a) * 100)}%</b></div>
        <div class="stat">Avg time <b>${a.done ? (a.totalTime / a.done).toFixed(1) : "–"}s</b></div>
        <div class="stat">Skill <b>${Math.round(a.skill * 100)}</b></div>
      </div>
      <div><strong>XP to next level: ${a.xp % 100} / 100</strong><div class="xpbar"><i style="width:${a.xp % 100}%"></i></div></div>
      <div class="dots">Last 10 jobs: ${dots}</div>`;
  } else return;
  pop.dataset.showing = "";
  pop.hidden = false;
}
function closePopup() { const p = document.getElementById("popup"); p.hidden = true; p.dataset.showing = ""; openAgent = null; showRanks = false; }
document.getElementById("popClose").onclick = closePopup;
document.getElementById("popup").addEventListener("click", e => { if (e.target.id === "popup") closePopup(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePopup(); });

function chat(who, text, kind = "") {
  const li = document.createElement("li");
  li.className = kind;
  const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  li.innerHTML = `<time>${t}</time><b>${esc(who)}</b> ${esc(text)}`;
  const box = document.getElementById("chat");
  box.prepend(li);
  while (box.children.length > 40) box.lastChild.remove();
}

/* Buttons */
document.getElementById("pauseBtn").onclick = e => { paused = !paused; e.target.textContent = paused ? "Play" : "Pause"; };
document.getElementById("rankBtn").onclick = () => { showRanks = true; openAgent = null; renderPopup(); };
document.getElementById("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = document.getElementById("newName").value.trim();
  const role = document.getElementById("newRole").value.trim();
  const shape = document.getElementById("newShape").value;
  if (!name || !role) return;
  makeAgent({ name, role, shape, color: pick(["#C0392B", "#27AE60", "#2980B9", "#F39C12", "#7F8C8D", "#1ABC9C"]), skill: 0.85 });
  chat(name, `built a new ${shape} and joined the clan as ${role}!`);
  e.target.reset();
  layout(); render();
});
window.addEventListener("resize", layout);

/* Start the village */
decorate();
placeTownHall();
makeAgent({ ...MAIL_SCOUT, real: true });
CLAN.forEach(makeAgent);
layout();
for (let i = 0; i < 40; i++) tick();   // warm-up so the village isn't empty at the start
chat("Town Hall", "The clan woke up and started working");
chat("Mail Scout", `checked your inbox: ${mailTodo()} things need you. Tap the post office!`);
render();
setInterval(tick, 1000);
</script>
